# litesentry 前端 + API 入口：HTTPS :443 → 127.0.0.1:8080（Go web/API）。
# 证书与 gRPC mTLS 共用同一份 server.crt/key（volume 挂载 /etc/litesentry/certs）。
# 生产建议保持 HSTS；80 端口强制跳 443。

upstream litesentry_web {
    server 127.0.0.1:8080;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/litesentry/certs/server.crt;
    ssl_certificate_key /etc/litesentry/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 1m;

    location / {
        proxy_pass http://litesentry_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}
