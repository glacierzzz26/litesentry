[package]
name = "litesentry-agent"
version = "0.1.0"
edition = "2021"
description = "litesentry 轻量监控 Agent（Rust）：主机 + 容器采集，gRPC 上报"

[[bin]]
name = "litesentry-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util"] }
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
sysinfo = "0.33"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"

[build-dependencies]
tonic-build = "0.12"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
