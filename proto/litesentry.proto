// litesentry 数据契约（唯一 proto 源）
//
// 阶段一：Agent 定时上报主机 + 容器指标。
// - 通信走 IPv4，Agent 通过 gRPC metadata 携带 token（证书 TLS/mTLS 预留，
//   测试阶段明文联调，上线前启用）。
// - Series 通用字段已预留，阶段二插件化直接启用。
syntax = "proto3";

package litesentry;

option go_package = "litesentry/server/gen;litesentrypb";

// ============ 基础消息 ============

// 网卡地址（IPv4 / IPv6，含 iface 与 scope）
message IPAddr {
  string family = 1;   // ipv4 | ipv6
  string addr   = 2;
  string iface  = 3;
  string scope  = 4;   // global | link | loopback
}

message Mem {
  uint64 total = 1;
  uint64 used  = 2;
}

message Disk {
  string mount = 1;
  string fs    = 2;
  uint64 total = 3;
  uint64 used  = 4;
}

// 网络速率（前后两采样差分得到）
message Net {
  uint64 rx_bps = 1;
  uint64 tx_bps = 2;
}

// ============ 主机指标 ============

message HostMetrics {
  string hostname = 1;
  string os       = 2;
  string arch     = 3;
  string kernel   = 4;
  uint64 uptime_s = 5;
  float  load_1m  = 6;
  float  load_5m  = 7;
  float  cpu_pct  = 8;
  Mem    mem      = 9;
  Mem    swap     = 10;
  repeated Disk   disks  = 11;
  Net    net      = 12;
  repeated IPAddr ips    = 13;   // IPv4 + IPv6 全量地址

  // Agent 自身进程占用（读 /proc/self；用于监控采集端自身开销）
  float  agent_cpu_pct = 14;   // 自身进程周期 CPU 占用（%）
  uint64 agent_mem_rss = 15;   // 自身 RSS（字节）
}

// ============ 容器指标 ============

// 容器内存（usage/limit，区别于主机的 total/used）
message ContainerMem {
  uint64 usage = 1;
  uint64 limit = 2;
}

message ContainerMetrics {
  string id       = 1;
  string name     = 2;
  string image    = 3;
  string state    = 4;
  uint32 restarts = 5;
  uint64 uptime_s = 6;
  float  cpu_pct  = 7;
  ContainerMem mem = 8;
  Net net          = 9;
}

// ============ 通用插件数据（阶段二启用，阶段一预留） ============

message Series {
  string                name   = 1;   // e.g. "host.cpu"
  map<string, string>   tags   = 2;   // 维度: agent_id, mount, container_id...
  map<string, double>   fields = 3;   // 指标: pct=12.3
  uint64                ts     = 4;
}

// ============ 控制通道（阶段二） ============

// 插件期望清单（manifest）：Server 指派本机应运行的插件与版本。
message PluginSpec {
  string plugin_id = 1;
  string version   = 2;
  string args_json = 3;   // 插件参数（JSON 字符串）
}

// 定时任务定义：由目标 agent 本地 cron 触发执行。
message TaskSpec {
  string task_id   = 1;
  string cron      = 2;   // 标准 5 段 cron
  string plugin_id = 3;
  string args_json = 4;
  uint32 timeout_s = 5;
  bool   run_now   = 6;   // 立即运行标记：Server 置位，agent 下个心跳立即执行一次，收到报告后 Server 清除
}

// 心跳响应下发的期望状态：Agent 发现 state_version != 已应用版本时重新应用。
message DesiredState {
  uint64 state_version = 1;           // 全局递增，任一配置变更联动 +1
  string frp_toml      = 2;           // 本机要运行的 frp 配置（frps 或 frpc），空串 = 不管理
  bool   frp_enabled   = 3;           // 是否启用 frp 进程管理
  repeated PluginSpec plugins = 4;    // manifest 期望版本
  repeated TaskSpec    tasks    = 5;  // 本机定时任务定义
}

// 拉插件二进制请求 / 流式分块。
message PluginRequest {
  string plugin_id = 1;
  string version   = 2;
}
message Chunk {
  bytes  data   = 1;   // 二进制分块
  string sha256 = 2;   // 完整二进制 SHA-256（末尾分块携带，用于校验）
  uint64 size   = 3;   // 完整二进制字节数（末尾分块携带）
  string error  = 4;   // 错误时返回
}

// ============ frp 状态（agent 上报） ============

message FrpTunnelStatus {
  string name      = 1;
  string type      = 2;   // tcp | udp | http | https | stcp ...
  string status    = 3;   // online | offline | error
  string err       = 4;
  uint64 rx_bytes  = 5;
  uint64 tx_bytes  = 6;
}
message FrpStatus {
  bool   running     = 1;   // frp 进程是否存活
  string frp_version = 2;
  string error       = 3;   // 未安装 / 启动失败等原因
  repeated FrpTunnelStatus tunnels = 4;
}

// ============ 定时任务执行结果（agent 上报） ============

message TaskRunReport {
  string task_id     = 1;
  uint64 started_at  = 2;
  uint64 finished_at = 3;
  string status      = 4;   // ok | failed | timeout | skipped
  int32  exit_code   = 5;
  string output      = 6;   // stdout/stderr 截断尾部
}

// ============ 上报批 ============

message MetricsBatch {
  string agent_id             = 1;
  uint64 ts                   = 2;   // unix 秒
  HostMetrics host            = 3;
  repeated ContainerMetrics containers = 4;
  repeated Series series      = 5;   // 插件统一输出（阶段二启用）
  FrpStatus frp               = 6;   // 本机 frp 隧道状态（阶段二）
  repeated TaskRunReport task_runs = 7;   // 定时任务执行结果（阶段二）
}

message PushAck {
  string server_time = 1;
  string message     = 2;
  DesiredState desired_state = 3;   // 心跳驱动下发：frp 配置 + 插件 manifest + 任务定义
}

// ============ 注册 ============

// 节点注册请求：携带机器自身信息，由 Server 分发 / 复用 agent_id。
message RegisterRequest {
  string hostname   = 1;
  string machine_id = 2;   // 机器指纹（Linux /etc/machine-id；缺省回退 hostname）
  string os         = 3;
  string arch       = 4;
  string kernel     = 5;
  string version    = 6;   // Agent 构建版本（CARGO_PKG_VERSION）
}

message RegisterReply {
  string agent_id    = 1;   // Server 分配：已注册过则复用历史 id，否则新建 UUID
  string server_time = 2;
}

// ============ 服务 ============

service Agent {
  // 节点注册：Agent 启动时用自身机器信息换取（或复用）agent_id
  rpc Register(RegisterRequest) returns (RegisterReply);
  // 常规定时上报（默认 60s/批，即心跳）；响应携带 DesiredState 下发配置
  rpc Push(MetricsBatch) returns (PushAck);
  // 拉插件二进制（流式分块）：Agent 在 DesiredState 发现缺/旧时主动调用
  rpc FetchPlugin(PluginRequest) returns (stream Chunk);
  // 可选：长连接流式，实时性要求高时启用（预留）
  rpc Stream(stream MetricsBatch) returns (stream PushAck);
}
