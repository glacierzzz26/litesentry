basePath: /api
definitions:
  api.BuiltinGroupView:
    properties:
      node_count:
        description: 上报该插件的节点数
        type: integer
      nodes:
        items:
          $ref: '#/definitions/api.BuiltinNodeView'
        type: array
      plugin_id:
        type: string
      versions:
        description: 去重后续（各节点可能版本不一）
        items:
          type: string
        type: array
    type: object
  api.BuiltinNodeView:
    properties:
      hostname:
        type: string
      sha256:
        type: string
      version:
        type: string
    type: object
  api.assignPluginBody:
    properties:
      agent_id:
        type: string
      args_json:
        type: string
      version:
        type: string
    type: object
  api.changePwdReq:
    properties:
      new_password:
        type: string
      old_password:
        type: string
    type: object
  api.frpView:
    properties:
      agent_id:
        description: frps 行恒为 "server"（哨兵）；前端不展示
        type: string
      agent_name:
        type: string
      enabled:
        type: boolean
      kind:
        type: string
      proxies:
        items:
          $ref: '#/definitions/store.FrpTunnel'
        type: array
      server_addr:
        type: string
      server_port:
        type: integer
      status:
        $ref: '#/definitions/store.FrpStatus'
      token_set:
        type: boolean
      updated_at:
        type: string
    type: object
  api.loginReq:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  api.loginResp:
    properties:
      expires_at:
        type: string
      must_change_password:
        type: boolean
      token:
        type: string
      user:
        $ref: '#/definitions/store.User'
    type: object
  api.resetPwdBody:
    properties:
      password:
        type: string
    type: object
  api.saveFrpBody:
    properties:
      enabled:
        type: boolean
      proxies:
        items:
          $ref: '#/definitions/store.FrpTunnel'
        type: array
      server_addr:
        type: string
      server_port:
        type: integer
      token:
        type: string
    type: object
  api.saveTaskBody:
    properties:
      args_json:
        type: string
      cron:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      name:
        type: string
      plugin_id:
        type: string
      target_agent_id:
        description: 空 = 公网机
        type: string
      timeout_s:
        type: integer
    type: object
  api.settingsView:
    properties:
      nexus_ingest_token_set:
        type: boolean
      nexus_source:
        type: string
      nexus_url:
        type: string
      server_agent_id:
        type: string
    type: object
  api.taskView:
    properties:
      args_json:
        type: string
      created_at:
        type: string
      cron:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_output_tail:
        type: string
      last_run_at:
        type: string
      last_status:
        description: ok | failed | timeout | skipped
        type: string
      name:
        type: string
      plugin_id:
        type: string
      run_now:
        description: 立即运行标记：POST /run 置位，agent 执行报告到达后回清
        type: boolean
      target_agent_id:
        description: 空 = 公网机（server 同机 agent）
        type: string
      target_agent_name:
        type: string
      timeout_s:
        type: integer
      updated_at:
        type: string
    type: object
  api.updateUserBody:
    properties:
      display_name:
        type: string
      role:
        type: string
    type: object
  api.userBody:
    properties:
      display_name:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  store.Agent:
    properties:
      agent_id:
        type: string
      arch:
        type: string
      created_at:
        type: string
      hostname:
        type: string
      ipv4:
        items:
          $ref: '#/definitions/store.IPAddr'
        type: array
      ipv6:
        items:
          $ref: '#/definitions/store.IPAddr'
        type: array
      kernel:
        type: string
      last_seen:
        type: string
      os:
        type: string
      status:
        description: Status 由 API 层计算（服务端权威）：online | offline，预留 upgrading 等扩展状态。
        type: string
      version:
        description: Agent 构建版本（注册上报）
        type: string
    type: object
  store.AgentPlugin:
    properties:
      agent_id:
        type: string
      args_json:
        type: string
      plugin_id:
        type: string
      version:
        type: string
    type: object
  store.AlertEvent:
    properties:
      agent_id:
        type: string
      agent_name:
        type: string
      entity_id:
        description: 容器规则 = 容器 id；主机/离线规则为空
        type: string
      entity_name:
        description: 容器规则 = 容器名称
        type: string
      id:
        type: string
      metric:
        type: string
      notified_at:
        type: string
      resolved_at:
        type: string
      rule_id:
        type: string
      rule_name:
        type: string
      severity:
        description: warning | critical
        type: string
      started_at:
        type: string
      state:
        description: firing | resolved
        type: string
      threshold:
        type: number
      value:
        type: number
    type: object
  store.AlertRule:
    properties:
      created_at:
        type: string
      duration_s:
        description: 持续超过阈值多久才触发（秒），0 = 立即
        type: integer
      enabled:
        type: boolean
      id:
        type: string
      metric:
        description: cpu_pct | mem_pct | load_1m | disk_pct | container_cpu | container_mem
          | container_down | offline
        type: string
      name:
        type: string
      op:
        description: '> | <'
        type: string
      severity:
        description: warning | critical
        type: string
      threshold:
        type: number
      updated_at:
        type: string
    type: object
  store.ContainerSample:
    properties:
      agent_id:
        type: string
      container_id:
        type: string
      cpu_pct:
        type: number
      image:
        type: string
      mem_limit:
        type: integer
      mem_usage:
        type: integer
      name:
        type: string
      net_rx_bps:
        type: integer
      net_tx_bps:
        type: integer
      restarts:
        type: integer
      state:
        type: string
      ts:
        type: string
      uptime_s:
        type: integer
    type: object
  store.DiskSample:
    properties:
      agent_id:
        type: string
      fs:
        type: string
      mount:
        type: string
      total:
        type: integer
      ts:
        type: string
      used:
        type: integer
    type: object
  store.FrpStatus:
    properties:
      error:
        type: string
      frp_version:
        type: string
      running:
        type: boolean
      ts:
        type: string
      tunnels:
        items:
          $ref: '#/definitions/store.FrpTunnelStatus'
        type: array
    type: object
  store.FrpTunnel:
    properties:
      local_ip:
        type: string
      local_port:
        type: integer
      name:
        type: string
      remote_port:
        type: integer
      type:
        description: tcp | udp | http | https | stcp ...
        type: string
    type: object
  store.FrpTunnelStatus:
    properties:
      err:
        type: string
      name:
        type: string
      rx_bytes:
        type: integer
      status:
        description: online | offline | error
        type: string
      tx_bytes:
        type: integer
      type:
        type: string
    type: object
  store.HostSample:
    properties:
      agent_cpu_pct:
        description: Agent 自身进程 CPU 占用（%）
        type: number
      agent_id:
        type: string
      agent_mem_rss:
        description: Agent 自身 RSS（字节）
        type: integer
      arch:
        type: string
      cpu_pct:
        type: number
      hostname:
        type: string
      kernel:
        type: string
      load_1m:
        type: number
      load_5m:
        type: number
      mem_total:
        type: integer
      mem_used:
        type: integer
      net_rx_bps:
        type: integer
      net_tx_bps:
        type: integer
      os:
        type: string
      swap_total:
        type: integer
      swap_used:
        type: integer
      ts:
        type: string
      uptime_s:
        type: integer
    type: object
  store.IPAddr:
    properties:
      addr:
        type: string
      family:
        description: ipv4 | ipv6
        type: string
      iface:
        type: string
      scope:
        description: global | link | loopback
        type: string
    type: object
  store.Overview:
    properties:
      disk_max:
        additionalProperties:
          format: float64
          type: number
        description: agent_id → 最高挂载点使用率%
        type: object
      firing:
        description: 当前 firing 事件数
        type: integer
      hosts:
        description: 每节点最近一条主机样本
        items:
          $ref: '#/definitions/store.HostSample'
        type: array
    type: object
  store.Plugin:
    properties:
      args_schema:
        description: 参数说明（前端表单用）
        type: string
      created_at:
        type: string
      id:
        description: 插件标识（稳定跨版本），如 "hello"
        type: string
      kind:
        description: 阶段二仅 binary
        type: string
      name:
        description: 展示名
        type: string
      sha256:
        type: string
      size:
        type: integer
      version:
        type: string
    type: object
  store.Task:
    properties:
      args_json:
        type: string
      created_at:
        type: string
      cron:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      last_output_tail:
        type: string
      last_run_at:
        type: string
      last_status:
        description: ok | failed | timeout | skipped
        type: string
      name:
        type: string
      plugin_id:
        type: string
      run_now:
        description: 立即运行标记：POST /run 置位，agent 下心跳执行一次后 Server 清除
        type: boolean
      target_agent_id:
        description: 空 = 公网机（server 同机 agent）
        type: string
      timeout_s:
        type: integer
      updated_at:
        type: string
    type: object
  store.TaskRun:
    properties:
      agent_id:
        type: string
      exit_code:
        type: integer
      finished_at:
        type: string
      id:
        type: string
      output:
        description: stdout/stderr 截断尾部
        type: string
      started_at:
        type: string
      status:
        description: ok | failed | timeout | skipped
        type: string
      task_id:
        type: string
    type: object
  store.User:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: string
      last_login_at:
        type: string
      must_change_password:
        description: 首次登录强制改密
        type: boolean
      role:
        description: 阶段一全 admin，列预留
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: litesentry
    url: https://github.com/
  description: 轻量主机 + 容器监控 Server REST 接口（前端面板取数）。Agent↔Server 走 gRPC，契约见 docs/proto.html。
  termsOfService: http://localhost:8080/
  title: litesentry API
  version: 0.3.0
paths:
  /agents:
    get:
      description: 全部 Agent 最新状态，含 IPv4/IPv6 地址快照
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Agent'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 节点列表
      tags:
      - 节点
  /agents/{id}/containers:
    get:
      description: 某节点在窗口内各容器的状态与资源样本，按时间升序
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: 起始 unix 秒（默认 1 小时前）
        in: query
        name: from
        type: integer
      - description: 结束 unix 秒（默认当前）
        in: query
        name: to
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.ContainerSample'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 容器指标时序
      tags:
      - 时序
  /agents/{id}/disks:
    get:
      description: 某节点在窗口内各挂载点的磁盘占用样本，按时间升序
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: 起始 unix 秒（默认 1 小时前）
        in: query
        name: from
        type: integer
      - description: 结束 unix 秒（默认当前）
        in: query
        name: to
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.DiskSample'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 磁盘指标时序
      tags:
      - 时序
  /agents/{id}/host:
    get:
      description: 某节点在窗口内的主机样本（CPU/内存/负载/网络/系统信息），按时间升序
      parameters:
      - description: Agent ID
        in: path
        name: id
        required: true
        type: string
      - description: 起始 unix 秒（默认 1 小时前）
        in: query
        name: from
        type: integer
      - description: 结束 unix 秒（默认当前）
        in: query
        name: to
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.HostSample'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 主机指标时序
      tags:
      - 时序
  /agents/{id}/plugins:
    get:
      description: 某 agent（或公网机 server）已指派的插件清单，供定时任务表单选择
      parameters:
      - description: agent_id，或 server（公网机）
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.AgentPlugin'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Agent 已指派插件
      tags:
      - 定时任务
  /agents/{id}/plugins/{pluginId}:
    delete:
      description: 从指定 agent 的 manifest 移除某插件指派
      parameters:
      - description: agent_id
        in: path
        name: id
        required: true
        type: string
      - description: 插件标识
        in: path
        name: pluginId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 取消插件指派
      tags:
      - 插件
  /alerts/events:
    get:
      description: 按时间窗口查询，可按节点 / 状态过滤；默认最近 24h
      parameters:
      - description: 起始 unix 秒
        in: query
        name: from
        type: integer
      - description: 结束 unix 秒
        in: query
        name: to
        type: integer
      - description: 节点 ID
        in: query
        name: agent_id
        type: string
      - description: firing | resolved
        in: query
        name: state
        type: string
      - description: 条数（默认 100，最大 500）
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.AlertEvent'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 告警事件列表
      tags:
      - 告警
  /alerts/rules:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.AlertRule'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 告警规则列表
      tags:
      - 告警
    post:
      consumes:
      - application/json
      parameters:
      - description: 规则（id 忽略）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.AlertRule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.AlertRule'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 新建告警规则
      tags:
      - 告警
  /alerts/rules/{id}:
    delete:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除告警规则
      tags:
      - 告警
    put:
      consumes:
      - application/json
      parameters:
      - description: 规则 ID
        in: path
        name: id
        required: true
        type: string
      - description: 规则（id 取自路径）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/store.AlertRule'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.AlertRule'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新告警规则
      tags:
      - 告警
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: 校验旧密码，写入新密码并清除 must_change_password
      parameters:
      - description: 旧/新密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.changePwdReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 旧密码错误 / 新密码过短
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 修改密码
      tags:
      - 认证
  /auth/login:
    post:
      consumes:
      - application/json
      description: 校验用户名密码，成功签发 JWT 并回写上次登录时间；新用户/被重置密码的用户返回 must_change_password=true
      parameters:
      - description: 用户名密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.loginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.loginResp'
        "400":
          description: 参数缺失
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: 凭据错误
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: 失败次数过多已锁定
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 登录
      tags:
      - 认证
  /auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
      security:
      - BearerAuth: []
      summary: 当前用户
      tags:
      - 认证
  /builtins:
    get:
      description: 聚合各节点注册上报的内置插件（host/docker/disk），按 id 分组；只读
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.BuiltinGroupView'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 内置插件清单
      tags:
      - 插件
  /frp:
    get:
      description: 全部 frps/frpc 配置，join 最近上报状态与目标节点主机名（token 不回传）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.frpView'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: FRP 配置列表
      tags:
      - FRP
  /frp/{kind}/{agent_id}:
    delete:
      description: 删除 frps/frpc 配置并下线对应 frp 进程（agent 下次心跳生效）
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除 FRP 配置
      tags:
      - FRP
    put:
      consumes:
      - application/json
      description: 新建（agent_id 不存在时）或更新 frps/frpc 配置；token 留空 = 保留原值
      parameters:
      - description: frps | frpc
        in: path
        name: kind
        required: true
        type: string
      - description: 目标 agent（frps 恒为 server）
        in: path
        name: agent_id
        required: true
        type: string
      - description: 配置体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.saveFrpBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.frpView'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 保存 FRP 配置
      tags:
      - FRP
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: status/time
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - 系统
  /overview:
    get:
      description: 一次返回窗口内每节点最新主机样本、每节点最高磁盘占用、当前 firing 事件数
      parameters:
      - description: 起始 unix 秒（默认 1 小时前）
        in: query
        name: from
        type: integer
      - description: 结束 unix 秒（默认当前）
        in: query
        name: to
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Overview'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 总览聚合
      tags:
      - 时序
  /plugins:
    get:
      description: 全部插件（含各版本元信息，不含二进制内容）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Plugin'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 插件仓库
      tags:
      - 插件
    post:
      consumes:
      - multipart/form-data
      description: 上传不可变插件版本（multipart：file + id/name/version）；服务端计算 SHA-256
      parameters:
      - description: 插件二进制
        in: formData
        name: file
        required: true
        type: file
      - description: 插件标识（稳定跨版本）
        in: formData
        name: id
        required: true
        type: string
      - description: 展示名
        in: formData
        name: name
        required: true
        type: string
      - description: 版本号（同 id 不可重复）
        in: formData
        name: version
        required: true
        type: string
      - description: 参数说明（前端表单用，JSON）
        in: formData
        name: args_schema
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Plugin'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 版本已存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 上传插件
      tags:
      - 插件
  /plugins/{id}:
    get:
      description: 某插件 id 的全部版本元信息
      parameters:
      - description: 插件标识
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.Plugin'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 插件详情
      tags:
      - 插件
  /plugins/{id}/assign:
    post:
      consumes:
      - application/json
      description: |-
        将某版本插件指派到指定 agent（覆盖旧指派）；agent 下次心跳拉取并执行。
        agent_id 可传 "server" 或空串表示公网机；内置插件（host/docker/disk）版本须与节点上报清单一致
      parameters:
      - description: 插件标识
        in: path
        name: id
        required: true
        type: string
      - description: agent_id / version / args_json
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.assignPluginBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 内置插件版本与节点上报不符
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: 插件版本不存在 / 未设置公网机 Agent
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 指派插件
      tags:
      - 插件
  /plugins/{id}/versions/{version}:
    delete:
      description: 删除不可变插件版本；若仍被任一节点指派则返回 409，须先取消指派
      parameters:
      - description: 插件标识
        in: path
        name: id
        required: true
        type: string
      - description: 版本号
        in: path
        name: version
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 仍被节点指派
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除插件版本
      tags:
      - 插件
  /settings:
    get:
      description: nexus 事件上报配置（token 只回传是否已设）+ 公网机 agent_id
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.settingsView'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 读取设置
      tags:
      - 设置
    put:
      consumes:
      - application/json
      description: 更新 nexus 事件上报配置（token 为空保留原值）与公网机 agent_id（缺省字段 = 不修改）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.settingsView'
        "400":
          description: 公网机 agent_id 未注册
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 保存设置
      tags:
      - 设置
  /settings/notify-test:
    post:
      description: 按当前 nexus 配置上报一条测试事件
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 未配置或发送失败
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 测试通知（nexus 连通性）
      tags:
      - 设置
  /tasks:
    get:
      description: 全部定时任务，含目标节点主机名与最近运行摘要（agent_id 不回传）
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.taskView'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 定时任务列表
      tags:
      - 定时任务
    post:
      consumes:
      - application/json
      description: 新建定时任务：cron 到期后目标 agent 本地触发插件一次性 run（插件必须已指派）
      parameters:
      - description: 任务定义
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.saveTaskBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.taskView'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 新建定时任务
      tags:
      - 定时任务
  /tasks/{id}:
    delete:
      description: 删除定时任务定义；历史运行记录保留（append-only 审计）
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除定时任务
      tags:
      - 定时任务
    put:
      consumes:
      - application/json
      description: 更新定时任务定义（含目标节点/插件/args 变更）
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: string
      - description: 任务定义
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.saveTaskBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.taskView'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新定时任务
      tags:
      - 定时任务
  /tasks/{id}/run:
    post:
      description: |-
        置位 run_now → 目标 agent 下个心跳立即执行一次（结果照常落运行历史）；任务须已启用，
        执行报告到达后 Server 自动清除标记（agent 恢复纯 cron 调度）
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.Task'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 立即运行任务
      tags:
      - 定时任务
  /tasks/{id}/runs:
    get:
      description: 某定时任务的执行历史（agent 上报，最近 limit 条，默认 50）
      parameters:
      - description: 任务 ID
        in: path
        name: id
        required: true
        type: string
      - description: 条数上限（默认 50，最大 200）
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.TaskRun'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 任务运行历史
      tags:
      - 定时任务
  /users:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/store.User'
            type: array
      security:
      - BearerAuth: []
      summary: 用户列表
      tags:
      - 用户
    post:
      consumes:
      - application/json
      parameters:
      - description: 用户名/初始密码/显示名
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.userBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: 用户名或密码不合规
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: 用户名已存在
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 新建用户
      tags:
      - 用户
  /users/{id}:
    delete:
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: 删自己 / 删最后一个用户
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 删除用户
      tags:
      - 用户
    put:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: string
      - description: 显示名/角色
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.updateUserBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更新用户
      tags:
      - 用户
  /users/{id}/password:
    put:
      consumes:
      - application/json
      parameters:
      - description: 用户 ID
        in: path
        name: id
        required: true
        type: string
      - description: 新密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.resetPwdBody'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/store.User'
        "400":
          description: 密码过短
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 重置密码
      tags:
      - 用户
securityDefinitions:
  BearerAuth:
    description: Web 面板 JWT（POST /api/auth/login 获取），格式：Bearer <jwt>
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
